name: Daily AI News to Slack

on:
  schedule:
    # 毎朝9時(JST) = 0:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Slack MCP
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json << 'EOF'
          {
            "mcpServers": {
              "Slack": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-slack"],
                "env": {
                  "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}",
                  "SLACK_TEAM_ID": "${{ secrets.SLACK_TEAM_ID }}"
                }
              }
            }
          }
          EOF

      - name: Run daily news task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd $GITHUB_WORKSPACE
          claude \
            --dangerously-skip-permissions \
            -p "$(cat daily_news_prompt.md)" \
            --cwd . \
            >> run.log 2>&1
          echo "Exit code: $?" >> run.log

      - name: Commit updated sent_articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sent_articles.json - $(date '+%Y-%m-%d')"
            git push origin ${{ github.ref_name }}
          fi
