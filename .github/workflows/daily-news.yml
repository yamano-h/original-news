name: Daily AI News to Slack

on:
  schedule:
    # 毎朝9時 JST (= 0時 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/charming-noether-AAYdW

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily news task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_SKIP_PROMPTS: "1"
        run: |
          claude \
            --dangerously-skip-permissions \
            -p "$(cat daily_news_prompt.md)" \
            --cwd "$GITHUB_WORKSPACE"

      - name: Commit updated sent_articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          git diff --cached --quiet || git commit -m "Update sent_articles.json with $(date '+%Y-%m-%d') news send"
          git push origin claude/charming-noether-AAYdW
