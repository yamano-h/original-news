name: Daily AI News to Slack

on:
  schedule:
    # 毎朝9時 JST (= 0:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # 手動実行も可能

jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/charming-noether-83uYk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic slack-sdk

      - name: Send daily news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python send_daily_news.py

      - name: Commit updated sent_articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update sent_articles.json [skip ci]"
            git push origin claude/charming-noether-83uYk
          fi
