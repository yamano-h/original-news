name: Daily AI News to Slack

on:
  schedule:
    # 毎朝9:00 JST (= 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude Code MCP (Slack)
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/mcp_settings.json << 'EOF'
          {
            "mcpServers": {
              "Slack": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-slack"],
                "env": {
                  "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}",
                  "SLACK_TEAM_ID": "${{ secrets.SLACK_TEAM_ID }}"
                }
              }
            }
          }
          EOF

      - name: Run daily news task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude \
            --dangerously-skip-permissions \
            -p "$(cat daily_news_prompt.md)" \
            --cwd "$GITHUB_WORKSPACE"

      - name: Commit updated sent_articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update sent_articles.json [$(date '+%Y-%m-%d')]"
            git push origin ${{ github.ref_name }}
          fi
