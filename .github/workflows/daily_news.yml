name: Daily AI News Digest

on:
  schedule:
    # 毎朝9:00 JST = 0:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  send-daily-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # sent_articles.json の更新・コミットに必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic slack-sdk

      - name: Run daily news script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python daily_news.py

      - name: Commit updated sent_articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          git diff --staged --quiet || git commit -m "chore: update sent_articles.json [$(date '+%Y-%m-%d')]"
          git push
