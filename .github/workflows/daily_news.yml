name: Daily AI News

on:
  schedule:
    - cron: '0 23 * * *'  # 8:00 AM JST (UTC+9)
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Collect and send news to Slack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/send_daily_news.py

      - name: Commit updated sent_articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          if git diff --staged --quiet; then
            echo "No new articles to record"
          else
            git commit -m "chore: update sent_articles.json [skip ci]"
            git push
          fi
